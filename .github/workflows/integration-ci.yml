name: integration-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install locked dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Run RC artifact tool tests
        run: python -m pytest tests/test_build_rc_artifact.py tests/test_verify_rc_artifact.py -q

      - name: Run tool tests
        run: python -m pytest -q

      - name: Self-scan public repo for leakage
        run: python tools/scan_public_repo.py --root .
